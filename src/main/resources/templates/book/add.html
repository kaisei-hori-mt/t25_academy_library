<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/add.css}" />
    <script type="text/javascript" th:src="@{/js/book/add.js}"></script>
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                <div class="page_title">書籍登録</div>
                <div class="page_contents">
                    <form id="book_register_form" th:object="${bookMstDto}" th:action="@{/book/add}" method="post">
                        <div class="mb30 flexarea" style="float: right;">
                            <span>
                                <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                            </span>
                        </div>
                        <p style="color: red;">*これは必須項目です</p>
                        <table style="width: 100%;">
                            <caption>
                                <tbody>
                                    <tr>
                                        <th scope="col" align="left">書籍名:&nbsp;<span style="color: red;">*</span></th>
                                        <tr>
                                            <td style="width: 100%;">
                                                <input type="text" name="title" th:field="*{title}" placeholder="書籍名を入力" style="width: 100%;"/>
                                                <div class="error_msg" th:if="${title}">
                                                    <div th:each="msg:${title}">
                                                        <p th:text="${msg}" style="color: red;"></p>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tr>
                                    <tr>
                                        <th scope="col" align="left">ISBN:&nbsp;<span style="color: red;">*</span></th>
                                        <tr>
                                            <td style="width: 100%;">
                                                <input type="text" name="isbn" th:field="*{isbn}" placeholder="ISBNを入力" style="width: 100%;"/>
                                                <div class="error_msg" th:if="${isbn}">
                                                    <div th:each="msg:${isbn}">
                                                        <p th:text="${msg}" style="color: red;"></p>
                                                    </div>
                                                </div>
                                            </td>
                                        </tr>
                                    </tr>
                                </tbody>
                            </caption>
                        </table>
                        <div class="btn_block">
                            <input type="submit" value="保存">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
